# The deck backends: Qwen3-TTS (voice-overs) + Ditto (talking heads).
#
# Run on an NVIDIA GPU:
#   docker compose up -d
#
# Run on an AMD GPU:
#   docker compose -f docker-compose.rocm.yml up -d
#
# Seed the models first (one-time, see the README):
#   huggingface-cli download Qwen/Qwen3-TTS-12Hz-1.7B-Base --local-dir models/qwen
#   huggingface-cli download Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign --local-dir models/qwen
#   huggingface-cli download digital-avatar/ditto-talkinghead --local-dir models/ditto
#
# Then point the deck at them:
#   export DECK_TTS_URL=http://127.0.0.1:8008/v1/audio
#   export DECK_AVATAR_URL=http://127.0.0.1:8020/v1/video
#   deck make my-talk --video

services:
  tts:
    image: mirafleet/deck-tts:cuda
    ports: ["8008:8008"]
    volumes:
      - ./models/qwen:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  avatar:
    image: mirafleet/deck-avatar:cuda
    ports: ["8020:8020"]
    volumes:
      - ./models/ditto:/opt/ditto/checkpoints:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
